name: Enhancement
description: A new feature or an improvement to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does it solve, or what does it make better?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Expected behavior, screens involved, anything already decided.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
